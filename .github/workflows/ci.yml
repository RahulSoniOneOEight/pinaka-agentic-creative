name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,media,google-image]"
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: ruff check src tests scripts
      - name: Format
        run: ruff format --check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Secret scan
        run: |
          if grep -RInE 'sk-[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' src tests config .opencode; then
            echo "Potential secret pattern found" >&2
            exit 1
          fi
