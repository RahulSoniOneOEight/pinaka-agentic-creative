[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinaka-agentic-creative"
version = "0.1.0"
description = "Controller-first foundation for auditable agentic creative production"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.14,<1",
  "mypy>=1.13,<2",
]
media = [
  "imageio-ffmpeg>=0.5,<1",
  "static-ffmpeg>=3,<4",
  "pymediainfo>=7,<8",
  "opencv-python-headless>=4.10,<5",
]
tts = [
  "kokoro-onnx>=0.6,<1",
]
asr = [
  "faster-whisper>=1.2,<2",
]
fonts = [
  "fonttools>=4.50,<5",
]
render = [
  "playwright>=1.65,<2",
]
motion = [
  "manim>=0.19,<1",
]
google-image = [
  "google-genai>=1.0,<2",
]

[project.scripts]
pinaka = "pinaka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: local subprocess/media/transport integration (included in the full release gate)",
]

# Static-typing ratchet: these modules are enforced today. The controller's
# feature mixins are typed incrementally; add a module here only when it is
# clean, so coverage monotonically grows and never regresses.
[tool.mypy]
python_version = "3.10"
files = [
  "src/pinaka/policy",
  "src/pinaka/operations",
  "src/pinaka/contracts",
  "src/pinaka/adapters",
  "src/pinaka/fal.py",
  "src/pinaka/captions.py",
  "src/pinaka/metadata.py",
  "src/pinaka/finishing.py",
  "src/pinaka/beats.py",
  "src/pinaka/assembly.py",
  "src/pinaka/studio_gateway.py",
  "src/pinaka/artifacts.py",
  "src/pinaka/database.py",
  "src/pinaka/errors.py",
  "src/pinaka/utils.py",
  "src/pinaka/enums.py",
  "src/pinaka/budget.py",
]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
