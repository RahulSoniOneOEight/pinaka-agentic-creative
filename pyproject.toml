[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinaka-agentic-creative"
version = "0.1.0"
description = "Controller-first foundation for auditable agentic creative production"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
pinaka = "pinaka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
