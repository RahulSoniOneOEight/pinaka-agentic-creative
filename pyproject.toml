[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinaka-agentic-creative"
version = "0.1.0"
description = "Controller-first foundation for auditable agentic creative production"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.14,<1",
]
media = [
  "imageio-ffmpeg>=0.5,<1",
  "static-ffmpeg>=3,<4",
  "pymediainfo>=7,<8",
  "opencv-python-headless>=4.10,<5",
]
tts = [
  "kokoro-onnx>=0.6,<1",
]
asr = [
  "faster-whisper>=1.2,<2",
]
fonts = [
  "fonttools>=4.50,<5",
]
render = [
  "playwright>=1.65,<2",
]
motion = [
  "manim>=0.19,<1",
]
gcp-image = [
  "google-genai>=1.0,<2",
]

[project.scripts]
pinaka = "pinaka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
